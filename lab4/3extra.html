<!DOCTYPE html>

<!--
   This page shows an animation of colored disks moving around
   in a canvas, bouncing off the edges.  The program uses WebGL.
   All of the points are drawn as single primitive of type POINTS.
   The color is an attribute in the vertex shader, allowing
   each point to be a different primitive.  The user can decide
   whether to have randomly colored points or to make all the
   points red.  The point size is a uniform variable, so all
   the points are the same size.  However, the user can select
   whether the size is large or small.
-->

<html>
<head>
<meta charset="UTF-8">

<script src="gl-matrix.js"></script>
<script>
"use strict";


let canvas;  // The canvas where WebGL draws.
let gl;  // The WebGL graphics context.


class Mesh {
    constructor(vertices, indices) {
        this.vertices = vertices
        this.indices = indices

        this.vao = gl.createVertexArray()
        gl.bindVertexArray(this.vao)

        this.vbo = gl.createBuffer()
        gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo)
        gl.bufferData(gl.ARRAY_BUFFER, this.vertices, gl.STREAM_DRAW)
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0)
        gl.enableVertexAttribArray(0)

        this.ibo = gl.createBuffer()
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.ibo)
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, this.indices, gl.STREAM_DRAW)

        gl.bindVertexArray(null)
        gl.bindBuffer(gl.ARRAY_BUFFER, null)
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null)
    }
}

class Cuboid extends Mesh {
    constructor(width, depth, height) {

        let vertices = new Float32Array([
            -width/2, -height/2, depth/2,
            width/2, -height/2, depth/2,
            width/2, height/2, depth/2,
            -width/2, height/2, depth/2,

            -width/2, -height/2, -depth/2,
            width/2, -height/2, -depth/2,
            width/2, height/2, -depth/2,
            -width/2, height/2, -depth/2,
        ])
        let indices = new Uint32Array([
            // front
            0, 1, 2,
            2, 3, 0,

            // top
            3, 2, 6,
            6, 7, 3,

            // right
            1, 5, 6,
            6, 2, 1,

            // left
            4, 7, 3,
            3, 0, 4,

            // bottom
            0, 1, 5,
            5, 4, 0,

            // back
            5, 6, 7,
            7, 4, 5,
        ])

        super(vertices, indices)
    }
}


// https://medium.com/@oscarsc/four-ways-to-create-a-mesh-for-a-sphere-d7956b825db4
class Sphere extends Mesh {
    constructor(parallelCount, meridianCount) {
        
        let r = 0.5
        
        let vertices = []
        let indices = []

        let northvertexindex = parallelCount * meridianCount;
        let southvertexindex = northvertexindex + 1;


        for (let i = 0; i < parallelCount; ++i) {
            let parallel = Math.PI * (i + 1) / (parallelCount + 1);

            // 0 -> 0, pi/2 -> r, pi -> 0
            let circler = r*Math.sin(parallel);
            let y = r*Math.cos(parallel);

            let botring = i*meridianCount;
            let topring = (i - 1)*(meridianCount);



            for (let j = 0; j < meridianCount; ++j) {
                let meridian = 2 * Math.PI * j / meridianCount;

                let x = circler*Math.cos(meridian);
                let z = circler*Math.sin(meridian);

                vertices.push(x, y, z)

                let nextj = (j + 1) % meridianCount;

                if (i == 0) {
                    indices.push(northvertexindex, botring + j, botring + nextj)
                
                } else {
                    if (i == parallelCount - 1) {
                        indices.push(southvertexindex, botring + j, botring + nextj)
                    }
                    indices.push(botring + j, botring + nextj, topring + nextj)
                    indices.push(topring + nextj, topring + j, botring + j)
                }
            }
        }

        vertices.push(0, r, 0, 0, -r, 0)

        super(new Float32Array(vertices), new Uint32Array(indices))  
    }
}

function PrintObj(vertices, indices) {
    let s = ""

    for (let i = 0; i < vertices.length; i += 3) {
        s = s+`v ${vertices[i]} ${vertices[i+1]} ${vertices[i+2]}\n`;
    }
    for (let i = 0; i < indices.length; i += 3) {
        s = s+`f ${indices[i]+1} ${indices[i+1]+1} ${indices[i+2]+1}\n`;
    }
    console.log(s)
}

class Torus extends Mesh {
    constructor(tubeRadius, radius, circleCount, verticesPerCircle) {
        
        let r = radius + tubeRadius;
        let tr = tubeRadius;
        
        let vertices = []
        let indices = []


        for (let i = 0; i < circleCount; ++i) {
            let parallel = 2*Math.PI*i / circleCount;


            let prevring = i * verticesPerCircle;
            let nextring = verticesPerCircle * ((i + 1) % circleCount);


            let x = r*Math.cos(parallel);
            let y = 0;
            let z = r*Math.sin(parallel);


            let circleCenter = glMatrix.vec3.fromValues(x, y, z);

            for (let j = 0; j < verticesPerCircle; ++j) {
                let meridian = 2*Math.PI*j / verticesPerCircle;

                let circleRot = glMatrix.vec3.fromValues(tr*Math.cos(meridian), tr*Math.sin(meridian), 0);
                
                let tubeRot = glMatrix.vec3.rotateZ(glMatrix.vec3.create(), circleRot, [0, 0, 0], parallel);
                
                let pos = glMatrix.vec3.add(glMatrix.vec3.create(), tubeRot, circleCenter);

                vertices.push(pos[0], pos[1], pos[2]);

                let nextj = (j + 1) % verticesPerCircle;

                indices.push(prevring + nextj, prevring + j, nextring + j);
                indices.push(nextring + j, nextring + nextj, prevring + nextj);
            }
        }

        super(new Float32Array(vertices), new Uint32Array(indices))  
    }
}


class Cylinder extends Mesh {
    constructor(radius, length, parallelCount, meridianCount) {
        
        let r = radius;
        
        let vertices = []
        let indices = []


        for (let i = 0; i < parallelCount; ++i) {
            let parallel = Math.PI * (i + 1) / (parallelCount + 1);

            let y = length * i / parallelCount - length/2;

            let botring = i*meridianCount;
            let topring = (i - 1)*(meridianCount);



            for (let j = 0; j < meridianCount; ++j) {
                let meridian = 2 * Math.PI * j / meridianCount;

                let x = r*Math.cos(meridian);
                let z = r*Math.sin(meridian);

                vertices.push(x, y, z)

                let nextj = (j + 1) % meridianCount;

                if (i != 0) {
                    indices.push(botring + j, botring + nextj, topring + nextj)
                    indices.push(topring + nextj, topring + j, botring + j)
                }
            }
        }

        super(new Float32Array(vertices), new Uint32Array(indices))  
    }
}

class Cone extends Mesh {
    constructor(meridianCount) {
        
        let r = 0.5
        
        let vertices = []
        let indices = []

        let topvertexindex = meridianCount;
        
        let y = -r;

        for (let i = 0; i < meridianCount; ++i) {

            let meridian = 2*Math.PI*i / (meridianCount + 1); 

            let x = r*Math.cos(meridian);
            let z = r*Math.sin(meridian);
            
            vertices.push(x, y, z);

            let nexti = (i + 1) % meridianCount
            indices.push(topvertexindex, i, nexti);
        }


        vertices.push(0, r, 0)

        super(new Float32Array(vertices), new Uint32Array(indices))  
    }
}

class Star extends Mesh {
    constructor(innerDist, outerDist, spikeCount, thickness) {
        
        let vertices = []
        let indices = []

        let T = thickness;

        let centerFrontIndex = 2 * spikeCount;
        let centerBackIndex = centerFrontIndex + 1;

        for (let i = 0; i < spikeCount; ++i) {

            let outerangle = Math.PI/2 + i * 2*Math.PI/spikeCount;
            let innerangle = Math.PI/spikeCount + outerangle;


            vertices.push(outerDist*Math.cos(outerangle), outerDist*Math.sin(outerangle), 0);
            vertices.push(innerDist*Math.cos(innerangle), innerDist*Math.sin(innerangle), 0);

            indices.push(centerFrontIndex, 2*i, 2*i+1);
            indices.push(centerFrontIndex, 2*i+1, (2*i+2) % (2*spikeCount));

            indices.push(centerBackIndex, 2*i, 2*i+1);
            indices.push(centerBackIndex, 2*i+1, (2*i+2) % (2*spikeCount));
        }
        
        
        vertices.push(0, 0, -T / 2, 0, 0, T / 2);

        super(new Float32Array(vertices), new Uint32Array(indices))  
    }
}

class Material {
    constructor(shaderProg) {
        this.shaderProg = shaderProg
    }

    ApplyMaterial() {
        assert(false && "base class ApplyMaterial was called")
    }
}

const monovert =`#version 300 es
    layout(location = 0) in vec4 a_coords;

    uniform mat4 u_MVP;

    void main() {
        gl_Position = u_MVP * a_coords;
    }`;

const monofrag =`#version 300 es
    precision highp float;
    
    uniform vec4 u_color;
    out vec4 o_color;
    
    void main() {
        float inv = 1.0 - gl_FragCoord.z;
        o_color = vec4(u_color.xyz * 12.0 * inv, 1.0);
    }`;

class MonochromeMaterial extends Material {  
    constructor(color) {
        super(new ShaderProgram(new Shader(monovert, gl.VERTEX_SHADER), new Shader(monofrag, gl.FRAGMENT_SHADER)))
        this.color = color
    }
    ApplyMaterial() {
        this.shaderProg.activate()
        gl.uniform4f(gl.getUniformLocation(this.shaderProg.get(), "u_color"), this.color.x, this.color.y, this.color.z, this.color.w)
    }
}

class GraphicsNode {
    constructor(mesh, material, model) {
        this.mesh = mesh
        this.material = material
        this.model = model
    }

    draw(camera) {
        gl.bindVertexArray(this.mesh.vao);
        this.material.ApplyMaterial();
        
        let mvp = glMatrix.mat4.copy(glMatrix.mat4.create(), this.model);

        let view = glMatrix.mat4.invert(glMatrix.mat4.create(), camera.model);

        glMatrix.mat4.mul(mvp, view, mvp);
        glMatrix.mat4.mul(mvp, camera.projection, mvp);

        gl.uniformMatrix4fv(gl.getUniformLocation(this.material.shaderProg.get(), "u_MVP"), false, mvp);
        gl.drawElements(gl.TRIANGLES, this.mesh.indices.length, gl.UNSIGNED_INT, 0);
    }

    update(transform) {
        this.model = transform * this.model
    }
}

class Shader {
    constructor(shaderSource, type) {
        this.type = type
        this.shader = gl.createShader(type);
        gl.shaderSource(this.shader, shaderSource);
        gl.compileShader(this.shader);
        if (!gl.getShaderParameter(this.shader, gl.COMPILE_STATUS)) {
            throw new Error("Error in shader:  " + gl.getShaderInfoLog(this.shader));
        }
    }
    get() {
        return this.shader
    }
    getType() {
        return this.type
    }
}

class ShaderProgram {
    constructor(vertShader, fragShader) {
        this.prog = gl.createProgram();
        gl.attachShader(this.prog, vertShader.get());
        gl.attachShader(this.prog, fragShader.get());
        gl.linkProgram(this.prog);
        if (!gl.getProgramParameter(this.prog, gl.LINK_STATUS)) {
            throw new Error("Link error in program:  " + gl.getProgramInfoLog(this.prog));
        }
    }
    activate() {
        gl.useProgram(this.prog)
    }
    get() {
        return this.prog
    }

}

class Camera {
    constructor(translation, rotation, projection, maxVelocity, maxAngleVelocity) {
        this.translation = translation;
        this.rotation = rotation;
        this.projection = projection

        this.maxVelocity = maxVelocity;
        this.maxAngleVelocity = maxAngleVelocity;

        this.model = glMatrix.mat4.create();
        this.velocity = glMatrix.vec3.create();
        this.angleVelocity = glMatrix.vec3.create();
    }
}

function assert(condition) {
    if (!condition) {
        throw "Assertion failed";
    }
}

class Vector4 {
    constructor(x, y, z, w) {
        this.x = x
        this.y = y
        this.z = z
        this.w = w
    }
}


// < 0 right turn
// > 0 left turn
function orient(v1, v2, v3) {
    let v = (v3.y - v1.y)*(v2.x - v1.x) - (v3.x - v1.x)*(v2.y - v1.y);
    return -v; // -v because y coordinate is flipped in webgl
}

function rightTurn(v1, v2, v3) {
    return orient(v1, v2, v3) < 0;
}

function leftTurn(v1, v2, v3) {
    return orient(v1, v2, v3) > 0;
}

const white = new Vector4(1, 1, 1, 1);
const lightgray = new Vector4(0.1, 0.1, 0.1, 1);
const black = new Vector4(0, 0, 0, 1);
const gray = new Vector4(0.4, 0.4, 0.4, 1);
const gold = new Vector4(1, 215/255, 0, 1);
const red = new Vector4(1, 0, 0, 1);
const green = new Vector4(0, 0.5, 0, 1);
const purple = new Vector4(111/255, 63/255, 245/255, 1);
const blue = new Vector4(0, 0, 0.5, 1);
const yellow = new Vector4(1, 1, 0, 1);


function arraysEqual(a, b) {
    if (a === b) return true;
    if (a == null || b == null) return false;
    if (a.length !== b.length) return false;


    for (var i = 0; i < a.length; ++i) {
        if (a[i] !== b[i]) return false;
    }
    return true;
}

function getRandom(minval, maxval) {
    // return vals[counter++];
    return minval + Math.random() * (maxval - minval);
}

function getRandomInt(minval, maxval) {
    // return vals.length/2;
    return Math.round(getRandom(minval, maxval));
}

function init() {
    try {canvas = document.getElementById("webglcanvas")}
    catch (e) {
        console.log(e)
        return
    }
    gl = canvas.getContext("webgl2", {alpha: true, depth: true});
    if (!gl) {
        console.log("Browser does not support WebGL");
        return
    }
    console.log(gl.getParameter(gl.SHADING_LANGUAGE_VERSION));
    console.log(gl.getParameter(gl.VERSION));
    console.log(gl.getParameter(gl.RENDERER));
    
    gl.enable(gl.DEPTH_TEST)
    gl.depthFunc(gl.LESS)

    let state = {};
    state.camera = new Camera(glMatrix.vec3.create(), glMatrix.vec3.create(), glMatrix.mat4.create(), 5, Math.PI/60);
    // glMatrix.mat4.ortho(state.camera.projection, -100, 100, -100, 100, 100, -100)

    glMatrix.mat4.perspective(state.camera.projection, Math.PI/2, canvas.width/canvas.height, 1, -100)

    let greenmat = new MonochromeMaterial(green);
    let purplemat = new MonochromeMaterial(purple);

    let cubemesh = new Cuboid(1, 1, 1);
    let torusmesh = new Torus(0.5, 0.5, 100, 100);
    let spheremesh = new Sphere(10, 10);
    let cylindermesh = new Cylinder(0.5, 0.5, 10, 10);
    let conemesh = new Cone(10);
    let starmesh = new Star(0.5, 1, 7, 0.6);

    let t = glMatrix.mat4.fromValues(
        8, 0, 0, 0,
        0, 8, 0, 0,
        0, 0, 8, 0,
        0, 0, -20, 1,
    );

    // glMatrix.mat4.mul(t, glMatrix.mat4.fromRotation(glMatrix.mat4.create(), Math.PI/2, new Float32Array([1, 0, 0])), t)

    
    state.nodes = []
    state.nodes.push(new GraphicsNode(starmesh, greenmat, t))

    for (let i = 0; i < 5; ++i) {
        state.nodes.push(new GraphicsNode(cubemesh, purplemat, glMatrix.mat4.fromValues(
            8, 0, 0, 0,
            0, 8, 0, 0,
            0, 0, 8, 0,
            getRandom(-50, 50), getRandom(-50, 50), getRandom(-80, -35), 1,
        )))
    }
    for (let i = 0; i < 5; ++i) {
        state.nodes.push(new GraphicsNode(torusmesh, purplemat, glMatrix.mat4.fromValues(
            8, 0, 0, 0,
            0, 8, 0, 0,
            0, 0, 8, 0,
            getRandom(-50, 50), getRandom(-50, 50), getRandom(-80, -35), 1,
        )))
    }
    for (let i = 0; i < 5; ++i) {
        state.nodes.push(new GraphicsNode(spheremesh, purplemat, glMatrix.mat4.fromValues(
            8, 0, 0, 0,
            0, 8, 0, 0,
            0, 0, 8, 0,
            getRandom(-50, 50), getRandom(-50, 50), getRandom(-80, -35), 1,
        )))
    }
    for (let i = 0; i < 5; ++i) {
        state.nodes.push(new GraphicsNode(cylindermesh, purplemat, glMatrix.mat4.fromValues(
            8, 0, 0, 0,
            0, 8, 0, 0,
            0, 0, 8, 0,
            getRandom(-50, 50), getRandom(-50, 50), getRandom(-80, -35), 1,
        )))
    }
    for (let i = 0; i < 5; ++i) {
        state.nodes.push(new GraphicsNode(conemesh, purplemat, glMatrix.mat4.fromValues(
            8, 0, 0, 0,
            0, 8, 0, 0,
            0, 0, 8, 0,
            getRandom(-50, 50), getRandom(-50, 50), getRandom(-80, -35), 1,
        )))
    }
    for (let i = 0; i < 5; ++i) {
        state.nodes.push(new GraphicsNode(starmesh, purplemat, glMatrix.mat4.fromValues(
            8, 0, 0, 0,
            0, 8, 0, 0,
            0, 0, 8, 0,
            getRandom(-50, 50), getRandom(-50, 50), getRandom(-80, -35), 1,
        )))
    }




    document.addEventListener("keydown", function (evt) {
        let vec = new Float32Array(3);

        let anglevec = new Float32Array(3);

        switch (evt.key) {
            case 'w': {
                vec[2] = -1
            } break;
            case 'a': {
                vec[0] = -1
            } break;
            case 's': {
                vec[2] = 1
            } break;
            case 'd': {
                vec[0] = 1
            } break;
            case ' ': {
                vec[1] = 1
            } break;
            case 'c': {
                vec[1] = -1
            } break;

            case 'i': {
                anglevec[0] = 1
            } break;
            case 'j': {
                anglevec[1] = 1
            } break;
            case 'k': {
                anglevec[0] = -1
            } break;
            case 'l': {
                anglevec[1] = -1
            } break;
            case 'u': {
                anglevec[2] = 1
            } break;
            case 'o': {
                anglevec[2] = -1
            } break;

        }

        let accel = 1;
        let angleaccel = Math.PI/720;

        state.camera.velocity[0] += accel*vec[0];
        state.camera.velocity[1] += accel*vec[1];
        state.camera.velocity[2] += accel*vec[2];

        state.camera.angleVelocity[0] += angleaccel*anglevec[0];
        state.camera.angleVelocity[1] += angleaccel*anglevec[1];
        state.camera.angleVelocity[2] += angleaccel*anglevec[2];
    });

    let prev = performance.now();
    function loop(curr) {

        let dt = (curr - prev) / 1000;
        prev = curr; 



        
        glMatrix.mat4.rotateX(state.camera.model, state.camera.model, state.camera.angleVelocity[0]);
        glMatrix.mat4.rotateY(state.camera.model, state.camera.model, state.camera.angleVelocity[1]);
        glMatrix.mat4.rotateZ(state.camera.model, state.camera.model, state.camera.angleVelocity[2]);
        
        let v = state.camera.velocity;
        glMatrix.mat4.translate(state.camera.model, state.camera.model, glMatrix.vec3.fromValues(v[0]*dt, v[1]*dt, v[2]*dt, 0));

        
        glMatrix.vec3.lerp(state.camera.angleVelocity, state.camera.angleVelocity, glMatrix.vec3.create(), 4*dt);        
        glMatrix.vec3.lerp(state.camera.velocity, state.camera.velocity, glMatrix.vec3.create(), 4*dt);


        gl.clearColor(0.23, 0.23, 0.23, 1);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        for (let i = 0; i < state.nodes.length; ++i) {
            state.nodes[i].draw(state.camera);
        }

        requestAnimationFrame(loop)
    }
    loop(performance.now());
}


window.onload = init;  // Arrange for init() to be called after page has loaded.

</script>
