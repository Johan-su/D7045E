<!DOCTYPE html>

<!--
   This page shows an animation of colored disks moving around
   in a canvas, bouncing off the edges.  The program uses WebGL.
   All of the points are drawn as single primitive of type POINTS.
   The color is an attribute in the vertex shader, allowing
   each point to be a different primitive.  The user can decide
   whether to have randomly colored points or to make all the
   points red.  The point size is a uniform variable, so all
   the points are the same size.  However, the user can select
   whether the size is large or small.
-->

"use strict";


let canvas;  // The canvas where WebGL draws.
let gl;  // The WebGL graphics context.


class Mesh {
    constructor(vertices, indices, normals) {
        this.vertices = vertices;
        this.indices = indices;
        this.normals = normals;

        this.vao = gl.createVertexArray();
        gl.bindVertexArray(this.vao);

        this.vbo1 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo1);
        gl.bufferData(gl.ARRAY_BUFFER, this.vertices, gl.STREAM_DRAW);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(0);

        this.vbo2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo2);
        gl.bufferData(gl.ARRAY_BUFFER, this.normals, gl.STREAM_DRAW);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(1);

        this.ibo = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.ibo);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, this.indices, gl.STREAM_DRAW);

        gl.bindVertexArray(null);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);
    }
}

class BasicCuboid extends Mesh {
    constructor(width, depth, height) {

        let vertices = [
            -width/2, -height/2, depth/2,
            width/2, -height/2, depth/2,
            width/2, height/2, depth/2,
            -width/2, height/2, depth/2,

            -width/2, -height/2, -depth/2,
            width/2, -height/2, -depth/2,
            width/2, height/2, -depth/2,
            -width/2, height/2, -depth/2,
        ];


        let indices = [
            // front
            0, 1, 2,
            2, 3, 0,

            // top
            3, 2, 6,
            6, 7, 3,

            // right
            1, 5, 6,
            6, 2, 1,

            // left
            4, 7, 3,
            3, 0, 4,

            // bottom
            0, 1, 5,
            5, 4, 0,

            // back
            5, 6, 7,
            7, 4, 5,
        ];

        super(new Float32Array(vertices), new Uint32Array(indices));
    }
}

function calculateNormals(vertices, indices) {
    
    let vecNormals = [];
    for (let i = 0; i < vertices.length/3; ++i) {
        vecNormals.push(glMatrix.vec3.create());
    }

    let di = 3;
    for (let i = 0; i < indices.length; i += di) {
        
        let i0 = indices[i];
        let i1 = indices[i+1];
        let i2 = indices[i+2];


        let v0 = glMatrix.vec3.fromValues(vertices[di*i0], vertices[di*i0+1], vertices[di*i0+2]);
        let v1 = glMatrix.vec3.fromValues(vertices[di*i1], vertices[di*i1+1], vertices[di*i1+2]);
        let v2 = glMatrix.vec3.fromValues(vertices[di*i2], vertices[di*i2+1], vertices[di*i2+2]);


        let v1v0sub = glMatrix.vec3.sub(glMatrix.vec3.create(), v1, v0);
        let v2v0sub = glMatrix.vec3.sub(glMatrix.vec3.create(), v2, v0);


        let cross = glMatrix.vec3.cross(glMatrix.vec3.create(), v1v0sub, v2v0sub);
        let normal = glMatrix.vec3.normalize(glMatrix.vec3.create(), cross);

        glMatrix.vec3.add(vecNormals[i0], vecNormals[i0], normal);
        glMatrix.vec3.add(vecNormals[i1], vecNormals[i1], normal);
        glMatrix.vec3.add(vecNormals[i2], vecNormals[i2], normal);
    }

    let normals = [];

    for (let i = 0; i < vecNormals.length; ++i) {
        glMatrix.vec3.normalize(vecNormals[i], vecNormals[i]);

        let v = vecNormals[i];

        normals.push(v[0], v[1], v[2]);
    }




    return normals;
}

        let normals = calculateNormals(vertices, indices);

        super(new Float32Array(vertices), new Uint32Array(indices), new Float32Array(normals));
    }

// https://medium.com/@oscarsc/four-ways-to-create-a-mesh-for-a-sphere-d7956b825db4
class Sphere extends Mesh {
    constructor(parallelCount, meridianCount) {
        
        let r = 0.5
        
        let vertices = []
        let indices = []

        let northvertexindex = parallelCount * meridianCount;
        let southvertexindex = northvertexindex + 1;


        for (let i = 0; i < parallelCount; ++i) {
            let parallel = Math.PI * (i + 1) / (parallelCount + 1);

            // 0 -> 0, pi/2 -> r, pi -> 0
            let circler = r*Math.sin(parallel);
            let y = r*Math.cos(parallel);

            let botring = i*meridianCount;
            let topring = (i - 1)*(meridianCount);

            for (let j = 0; j < meridianCount; ++j) {
                let meridian = 2 * Math.PI * j / meridianCount;

                let x = circler*Math.cos(meridian);
                let z = circler*Math.sin(meridian);

                vertices.push(x, y, z)

                let nextj = (j + 1) % meridianCount;

                if (i == 0) {
                    indices.push(botring + nextj, botring + j, northvertexindex);
                    // indices.push(northvertexindex, botring + j, botring + nextj)
                
                } else {
                    if (i == parallelCount - 1) {
                        indices.push(southvertexindex, botring + j, botring + nextj)
                    }
                    indices.push(botring + nextj, botring + j, topring + j);
                    indices.push(topring + j, topring + nextj, botring + nextj);

                    // indices.push(botring + j, botring + nextj, topring + nextj);
                    // indices.push(topring + nextj, topring + j, botring + j);
                }
            }
        }

        vertices.push(0, r, 0, 0, -r, 0)

        let normals = calculateNormals(vertices, indices);


        super(new Float32Array(vertices), new Uint32Array(indices), new Float32Array(normals));
    }
}

function PrintObj(vertices, indices, normals) {
    let s = ""

    for (let i = 0; i < vertices.length; i += 3) {
        s = s+`v ${vertices[i]} ${vertices[i+1]} ${vertices[i+2]}\n`;
    }
    for (let i = 0; i < normals.length; i += 3) {
        s = s+`vn ${normals[i]} ${normals[i+1]} ${normals[i+2]}\n`;
    }
    for (let i = 0; i < indices.length; i += 3) {
        s = s+`f ${indices[i]+1}//${indices[i]+1} ${indices[i+1]+1}//${indices[i+1]+1} ${indices[i+2]+1}//${indices[i+2]+1}\n`;
    }
    
    console.log(s)
}

class Torus extends Mesh {
    constructor(tubeRadius, radius, circleCount, verticesPerCircle) {
        
        
        let vertices = []
        let indices = []
        let normals = [];


        for (let i = 0; i < circleCount; ++i) {
            let parallel = 2*Math.PI*i / circleCount;


            let prevring = i * verticesPerCircle;
            let nextring = verticesPerCircle * ((i + 1) % circleCount);

            for (let j = 0; j < verticesPerCircle; ++j) {
                let meridian = 2*Math.PI*j / verticesPerCircle;


                let x = (radius + tubeRadius * Math.cos(meridian)) * Math.cos(parallel);
                let y = tubeRadius * Math.sin(meridian);
                let z = (radius + tubeRadius * Math.cos(meridian)) * Math.sin(parallel);
                vertices.push(x, y, z);
                normals.push(Math.cos(meridian)*Math.cos(parallel), Math.sin(meridian), Math.cos(meridian)*Math.sin(parallel));


                let nextj = (j + 1) % verticesPerCircle;

                indices.push(nextring + j, prevring + j, prevring + nextj);
                indices.push(prevring + nextj, nextring + nextj, nextring + j);
            }
        }
        // normals = calculateNormals(vertices, indices);
        // PrintObj(vertices, indices, normals);
        super(new Float32Array(vertices), new Uint32Array(indices), new Float32Array(normals));
    }
}


class Cylinder extends Mesh {
    constructor(radius, length, parallelCount, meridianCount) {
        
        let r = radius;
        
        let vertices = [];
        let indices = [];
        let normals = [];


        for (let i = 0; i < parallelCount; ++i) {
            let parallel = Math.PI * (i + 1) / (parallelCount + 1);

            let y = length * i / parallelCount - length/2;

            let botring = i*meridianCount;
            let topring = (i - 1)*(meridianCount);



            for (let j = 0; j < meridianCount; ++j) {
                let meridian = 2 * Math.PI * j / meridianCount;

                let x = r*Math.cos(meridian);
                let z = r*Math.sin(meridian);

                vertices.push(x, y, z)
                normals.push(Math.cos(meridian), 0, Math.sin(meridian));
                let nextj = (j + 1) % meridianCount;

                if (i != 0) {
                    indices.push(botring + j, botring + nextj, topring + nextj)
                    indices.push(topring + nextj, topring + j, botring + j)
                }
            }
        }
        // normals = calculateNormals(vertices, indices);
        super(new Float32Array(vertices), new Uint32Array(indices), new Float32Array(normals));
    }
}

class Cone extends Mesh {
    constructor(meridianCount) {
        
        let r = 0.5
        
        let vertices = []
        let indices = []

        let topvertexindex = meridianCount;
        
        let y = -r;

        for (let i = 0; i < meridianCount; ++i) {

            let meridian = 2*Math.PI*i / meridianCount; 

            let x = r*Math.cos(meridian);
            let z = r*Math.sin(meridian);
            
            vertices.push(x, y, z);

            let nexti = (i + 1) % meridianCount
            indices.push(nexti, i, topvertexindex);
        }


        vertices.push(0, r, 0)
        let normals = calculateNormals(vertices, indices);
        super(new Float32Array(vertices), new Uint32Array(indices), new Float32Array(normals));
    }
}

class Star extends Mesh {
    constructor(innerDist, outerDist, spikeCount, thickness) {
        
        let vertices = []
        let indices = []

        let T = thickness;

        let centerFrontIndex = 2 * spikeCount;
        let centerBackIndex = centerFrontIndex + 1;

        for (let i = 0; i < spikeCount; ++i) {

            let outerangle = Math.PI/2 + i * 2*Math.PI/spikeCount;
            let innerangle = Math.PI/spikeCount + outerangle;


            vertices.push(outerDist*Math.cos(outerangle), outerDist*Math.sin(outerangle), 0);
            vertices.push(innerDist*Math.cos(innerangle), innerDist*Math.sin(innerangle), 0);

            indices.push(2*i+1, 2*i, centerFrontIndex);
            indices.push((2*i+2) % (2*spikeCount), 2*i+1, centerFrontIndex);

            indices.push(centerBackIndex, 2*i, 2*i+1);
            indices.push(centerBackIndex, 2*i+1, (2*i+2) % (2*spikeCount));
        }
        
        
        vertices.push(0, 0, -T / 2, 0, 0, T / 2);
        let normals = calculateNormals(vertices, indices);
        super(new Float32Array(vertices), new Uint32Array(indices), new Float32Array(normals));
    }
}

class Material {
    constructor(shaderProg) {
        this.shaderProg = shaderProg
    }

    ApplyMaterial() {
        assert(false && "base class ApplyMaterial was called")
    }
}

const monovert =`#version 300 es
    layout(location = 0) in vec4 a_coords;
    layout(location = 1) in vec3 a_normals;
    
    uniform mat4 u_normalMatrix;
    uniform mat4 u_MV;
    uniform mat4 u_MVP;

    out vec3 v_normal;
    out vec3 v_fragPos;

    void main() {
        gl_Position = u_MVP * a_coords;
        v_fragPos = (u_MV * a_coords).xyz;
        v_normal = (u_normalMatrix * vec4(normalize(a_normals), 0.0)).xyz;
    }`;

const monofrag =`#version 300 es
    precision highp float;

    uniform vec3 u_lightPosition; // eye space
    uniform vec3 u_lightColor;


    uniform vec4 u_color;

    in vec3 v_fragPos;

    in vec3 v_normal;
    out vec4 o_color;
    
    void main() {
        
        vec3 ambient = vec3(0.1);

        vec3 normal = normalize(v_normal);

        vec3 diff = u_lightPosition - v_fragPos;


        vec3 L = normalize(diff);
        vec3 V = normalize(-v_fragPos);

        float diffuseStrength = max(0.0, dot(normal, L));
        vec3 diffuse = diffuseStrength * u_lightColor;

        vec3 R = reflect(-L, normal);

        float specularStrength = pow(max(dot(R, V), 0.0), 32.0);
        vec3 specular = 0.4 * specularStrength * u_lightColor; 

        vec3 lighting = ambient + diffuse + specular;
        o_color = vec4(lighting * u_color.xyz, 1);
    }`;

class MonochromeMaterial extends Material {  
    constructor(color) {
        super(new ShaderProgram(new Shader(monovert, gl.VERTEX_SHADER), new Shader(monofrag, gl.FRAGMENT_SHADER)))
        this.color = color
    }
    ApplyMaterial() {
        this.shaderProg.activate()
        gl.uniform4f(gl.getUniformLocation(this.shaderProg.get(), "u_color"), this.color.x, this.color.y, this.color.z, this.color.w)
    }
}

class GraphicsNode extends BaseNode {
    constructor(mesh, material, scale, position, rotation, subnodes) {
        super(scale, position, rotation, subnodes)

        this.mesh = mesh
        this.material = material
    }

    draw(mvp, normalMatrix, mv, lightpos, lightcolor) {
        gl.bindVertexArray(this.mesh.vao);
        this.material.ApplyMaterial();

        let eyelightpos = glMatrix.vec3.transformMat4(glMatrix.vec3.create(), lightpos, mv);

        gl.uniform3f(gl.getUniformLocation(this.material.shaderProg.get(), "u_lightColor"), lightcolor[0], lightcolor[1], lightcolor[2]);
        gl.uniform3f(gl.getUniformLocation(this.material.shaderProg.get(), "u_lightPosition"), eyelightpos[0], eyelightpos[1], eyelightpos[2]);
        gl.uniformMatrix4fv(gl.getUniformLocation(this.material.shaderProg.get(), "u_MV"), false, mv);        
        gl.uniformMatrix4fv(gl.getUniformLocation(this.material.shaderProg.get(), "u_normalMatrix"), false, normalMatrix);        
        gl.uniformMatrix4fv(gl.getUniformLocation(this.material.shaderProg.get(), "u_MVP"), false, mvp);
        gl.drawElements(gl.TRIANGLES, this.mesh.indices.length, gl.UNSIGNED_INT, 0);
    }

    update(transform) {
        this.model = transform * this.model
    }
}

class Shader {
    constructor(shaderSource, type) {
        this.type = type
        this.shader = gl.createShader(type);
        gl.shaderSource(this.shader, shaderSource);
        gl.compileShader(this.shader);
        if (!gl.getShaderParameter(this.shader, gl.COMPILE_STATUS)) {
            throw new Error("Error in shader:  " + gl.getShaderInfoLog(this.shader));
        }
    }
    get() {
        return this.shader
    }
    getType() {
        return this.type
    }
}

class ShaderProgram {
    constructor(vertShader, fragShader) {
        this.prog = gl.createProgram();
        gl.attachShader(this.prog, vertShader.get());
        gl.attachShader(this.prog, fragShader.get());
        gl.linkProgram(this.prog);
        if (!gl.getProgramParameter(this.prog, gl.LINK_STATUS)) {
            throw new Error("Link error in program:  " + gl.getProgramInfoLog(this.prog));
        }
    }
    activate() {
        gl.useProgram(this.prog)
    }
    get() {
        return this.prog
    }

}

function arraysEqual(a, b) {
    if (a === b) return true;
    if (a == null || b == null) return false;
    if (a.length !== b.length) return false;


    for (var i = 0; i < a.length; ++i) {
        if (a[i] !== b[i]) return false;
    }
    return true;
}

function getRandom(minval, maxval) {
    // return vals[counter++];
    return minval + Math.random() * (maxval - minval);
}

function getRandomInt(minval, maxval) {

function drawNode(node, parentTransform, view, projection) {

    let radtodeg = 180 / Math.PI;

    let q = glMatrix.quat.fromEuler(glMatrix.quat.create(), radtodeg*node.rotation[0], radtodeg*node.rotation[1], radtodeg*node.rotation[2], 'xyz');
    node.model = glMatrix.mat4.fromRotationTranslationScale(
        glMatrix.mat4.create(),
        q,
        node.position,
        node.scale
    );

    let shifted = glMatrix.mat4.mul(glMatrix.mat4.create(), parentTransform, node.model);


    let mv = glMatrix.mat4.mul(glMatrix.mat4.create(), view, shifted);
    
    let normalMatrix = glMatrix.mat4.clone(mv);
    normalMatrix[12] = 0;
    normalMatrix[13] = 0;
    normalMatrix[14] = 0;
    glMatrix.mat4.invert(normalMatrix, normalMatrix);
    glMatrix.mat4.transpose(normalMatrix, normalMatrix);

    let mvp = glMatrix.mat4.mul(glMatrix.mat4.create(), projection, mv);

    let lightpos = [4, 3, 4];

    let lightcolor = [1, 1, 1];

    node.draw(mvp, normalMatrix, mv, lightpos, lightcolor);

    for (let i = 0; i < node.subnodes.length; ++i) {
        drawNode(node.subnodes[i], shifted, view, projection);
    }
}

function Scale(scale) {
    let scal;
    if (typeof scale == "number") {
        scal = [scale, scale, scale];
    } else {
        scal = scale;
    }
    return scal;
}

function Translation(translation) {
    let tran;
    if (typeof translation == "number") {
        tran = [translation, translation, translation];
    } else {
        tran = translation;
    } 
    return tran;
}

function Rotation(rotation) {
    let rot;
    if (typeof rotation == "number") {
        rot = [rotation, rotation, rotation];
    } else {
        rot = rotation;
    }
    return rot;
}


function matFromComponents(scale, translation, rotation) {

    let matrix = glMatrix.mat4.create();

    let rot;
    let tran;
    let scal;
    
    if (typeof rotation == "number") {
        rot = [rotation, rotation, rotation];
    } else {
        rot = rotation;
    }

    if (typeof translation == "number") {
        tran = [translation, translation, translation];
    } else {
        tran = translation;
    } 


    if (typeof scale == "number") {
        scal = [scale, scale, scale];
    } else {
        scal = scale;
    }


    glMatrix.mat4.translate(matrix, matrix, tran);
    glMatrix.mat4.rotateX(matrix, matrix, rot[0]);
    glMatrix.mat4.rotateY(matrix, matrix, rot[1]);
    glMatrix.mat4.rotateZ(matrix, matrix, rot[2]);
    glMatrix.mat4.scale(matrix, matrix, scal);


    assertReal(matrix);


    return matrix;
}

function assertReal(matrix) {
    for (let i = 0; i < matrix.length; ++i) {
        assert(!isNaN(matrix[i]));
    }
}

    let torusmesh = new Torus(0.5, 1.0, 100, 100);
    let spheremesh = new Sphere(100, 100);
    let cylindermesh = new Cylinder(0.5, 5, 50, 50);
    let conemesh = new Cone(10);
    let starmesh = new Star(0.5, 1, 7, 0.6);

    let wallmesh = new Cuboid(1, 0.1, 1);
    // glMatrix.mat4.mul(t, glMatrix.mat4.fromRotation(glMatrix.mat4.create(), Math.PI/2, new Float32Array([1, 0, 0])), t)



    

    let floor = new BaseNode(1, 0, 0, []);

    let floormat = whitemat;

    for (let z = 0; z < 8; ++z) {

        for (let x = 0; x < 8; ++x) {
            floor.subnodes.push(new GraphicsNode(cubemesh, floormat, 1, [x, 0, z], 0, []));

            if (x != 7) {
                if (floormat == whitemat) floormat = blackmat;
                else floormat = whitemat;
            }
        }
    }



    
    let footr = new GraphicsNode(conemesh, graymat, 0.12, [-0.5, 0, 0], 0, []);  
    let legr = new GraphicsNode(cubemesh, graymat, 0.12, [-0.5, 0, 0], 0, [footr]);

    let footl = new GraphicsNode(conemesh, graymat, 0.12, [-0.5, 0, 0], 0, []);
    let legl = new GraphicsNode(cubemesh, graymat, 0.12, 0, 0, [footl]);   
    
    let handr = new GraphicsNode(spheremesh, graymat, 0.12, [-0.5, 0, 0], 0, []);
    let armr = new GraphicsNode(armmesh, greenmat, 1, [-0.55, 0.45, 0], [0, Math.PI/2, 0], [handr]);

    let handl = new GraphicsNode(spheremesh, graymat, 0.12, [0.5, 0, 0], 0, []);
    let arml = new GraphicsNode(armmesh, greenmat, 1, [0.55, 0.45, 0], [0, -Math.PI/2, 0], [handl]);

    let headstar = new GraphicsNode(starmesh, redmat, 1, [0, 1.8, 0], [0, 0, 0], []);

    let head = new GraphicsNode(spheremesh, greenmat, 0.5, [0, 0.75, 0], 0, [headstar]);

    let torso = new GraphicsNode(cubemesh, graymat, 1, [4, 1, 3], 0, [head, arml, armr, legl, legr]);
    

    let sphere = new GraphicsNode(spheremesh, yellowmat, 1, [1, 1, 1], 0, []);
    let cube = new GraphicsNode(cubemesh, yellowmat, 1, [2.5, 1, 6], 0, []);
    let cone = new GraphicsNode(conemesh, yellowmat, 1, [7, 1, 5], [0, 0, -Math.PI/2], []);
    let torus = new GraphicsNode(torusmesh, yellowmat, 0.3, [7, 1, 1], [0, 0, -Math.PI/2], []);
    let cylinder = new GraphicsNode(cylindermesh, yellowmat, 0.3, [3, 1, 1], [0, 0, -Math.PI/2], []);




    state.base = new BaseNode(1, 0, 0, [torso, floor, sphere, cube, cone, torus, cylinder]);


    // walls

    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [0, 1, 0.5], [0, 0, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [1, 1, 0.5], [0, 0, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [2, 1, 0.5], [0, 0, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [3, 1, 0.5], [0, 0, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [4, 1, 0.5], [0, 0, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [5, 1, 0.5], [0, 0, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [6, 1, 0.5], [0, 0, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [7, 1, 0.5], [0, 0, 0], []));


    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [7.5, 1, 1], [0, Math.PI/2, 0], []));

    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [6.5, 1, 2], [0, Math.PI/2, 0], []));
    // state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [6.5, 1, 3], [0, Math.PI/2, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [6.5, 1, 4], [0, Math.PI/2, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [6.5, 1, 5], [0, Math.PI/2, 0], []));


    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [1.5, 1, 1], [0, Math.PI/2, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [1.5, 1, 2], [0, Math.PI/2, 0], []));
    // state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [1.5, 1, 3], [0, Math.PI/2, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [1.5, 1, 4], [0, Math.PI/2, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [1.5, 1, 5], [0, Math.PI/2, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [1.5, 1, 6], [0, Math.PI/2, 0], []));

    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [0, 1, 4.5], 0, []));
    // state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [1, 1, 4.5], 0, []));

    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [2, 1, 4.5], 0, []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [3, 1, 4.5], 0, []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [4, 1, 4.5], 0, []));
    // state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [5, 1, 4.5], 0, []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [6, 1, 4.5], 0, []));


    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [-0.5, 1, 1], [0, Math.PI/2, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [-0.5, 1, 2], [0, Math.PI/2, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [-0.5, 1, 3], [0, Math.PI/2, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [-0.5, 1, 4], [0, Math.PI/2, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [-0.5, 1, 5], [0, Math.PI/2, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [-0.5, 1, 6], [0, Math.PI/2, 0], []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [-0.5, 1, 7], [0, Math.PI/2, 0], []));



    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [0, 1, 7.5], 0, []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [1, 1, 7.5], 0, []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [2, 1, 7.5], 0, []));

    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [4, 1, 7.5], 0, []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [5, 1, 7.5], 0, []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [6, 1, 7.5], 0, []));
    state.base.subnodes.push(new GraphicsNode(wallmesh, bluemat, 1, [7, 1, 7.5], 0, []));




    document.addEventListener("keydown", function (evt) {
        let vec = new Float32Array(3);

        let anglevec = new Float32Array(3);

        switch (evt.key) {
            case 'w': {
                vec[2] = -1
            } break;
            case 'a': {
                vec[0] = -1
            } break;
            case 's': {
                vec[2] = 1
            } break;
            case 'd': {
                vec[0] = 1
            } break;
            case ' ': {
                vec[1] = 1
            } break;
            case 'c': {
                vec[1] = -1
            } break;

            case 'i': {
                anglevec[0] = 1
            } break;
            case 'j': {
                anglevec[1] = 1
            } break;
            case 'k': {
                anglevec[0] = -1
            } break;
            case 'l': {
                anglevec[1] = -1
            } break;
            case 'u': {
                anglevec[2] = 1
            } break;
            case 'o': {
                anglevec[2] = -1
            } break;
            case 'r': {
                let scale = glMatrix.vec3.create();
                let translation = glMatrix.vec3.create();
                glMatrix.mat4.decompose(glMatrix.quat.create(), translation, scale, state.camera.model);

                state.camera.nextModel = glMatrix.mat4.fromValues(
                    scale[0], 0, 0, 0,
                    0, scale[1], 0, 0,
                    0, 0, scale[2], 0,
                    translation[0], translation[1], translation[2], 1,
                );
                state.camera.velocity = glMatrix.vec3.create();
                state.camera.angleVelocity = glMatrix.vec3.create();
            } break;

        }

        let accel = 1;
        let angleaccel = Math.PI/8;

        glMatrix.vec3.scaleAndAdd(state.camera.velocity, state.camera.velocity, vec, accel);
        glMatrix.vec3.scaleAndAdd(state.camera.angleVelocity, state.camera.angleVelocity, anglevec, angleaccel);
    });



    let prev = performance.now();
    function loop(curr) {
        let dt = (curr - prev) / 1000;
        prev = curr; 

        if (state.camera.nextModel != null) {
            state.camera.model = state.camera.nextModel;
            state.camera.nextModel = null;
        }

        let decay = Math.exp(-4*dt);
        
        let scale = 0.5+Math.abs(Math.cos(curr / 1000));
        headstar.scale = glMatrix.vec3.fromValues(scale, scale, scale);

        armr.rotation[2] += Math.PI/720;
        arml.rotation[2] += Math.PI/720;        
        
        head.rotation[1] += Math.PI/720;

        torso.position = [4+Math.cos(curr / 1000), torso.position[1], torso.position[2]];
        head.position = [head.position[0], head.position[1], 0.25*Math.cos(2*curr / 1000)];



        glMatrix.vec3.scale(state.camera.angleVelocity, state.camera.angleVelocity, decay);        
        glMatrix.vec3.scale(state.camera.velocity, state.camera.velocity, decay);


        glMatrix.mat4.translate(state.camera.model, state.camera.model, glMatrix.vec3.scale(glMatrix.vec3.create(), state.camera.velocity, dt));
        
        glMatrix.mat4.rotateX(state.camera.model, state.camera.model, state.camera.angleVelocity[0]*dt);
        glMatrix.mat4.rotateY(state.camera.model, state.camera.model, state.camera.angleVelocity[1]*dt);
        glMatrix.mat4.rotateZ(state.camera.model, state.camera.model, state.camera.angleVelocity[2]*dt);
        
        let view = glMatrix.mat4.invert(glMatrix.mat4.create(), state.camera.model);


        gl.clearColor(0.23, 0.23, 0.23, 1);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);


        drawNode(state.base, glMatrix.mat4.create(), view, state.camera.projection);

        requestAnimationFrame(loop)
    }
    loop(performance.now());
}


window.onload = init;  // Arrange for init() to be called after page has loaded.

</script>
